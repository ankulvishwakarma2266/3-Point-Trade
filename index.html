<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:#000b10;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
}

.munaaf-page{
  width:100%;
  min-height:100vh;
  background:#00090e;
  padding:28px 22px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.munaaf-box{
  width:100%;
  max-width:650px;
  min-height:900px;
  border:2px solid #00d9ff;
  border-radius:60px;
  padding:30px 28px 28px;
  background:
    radial-gradient(circle at 50% 20%, rgba(0,210,255,.08), transparent 30%),
    #000b10;
  box-shadow:
    0 0 10px rgba(0,217,255,.7),
    inset 0 0 25px rgba(0,217,255,.05);
  text-align:center;
}

.munaaf-img{
  width:200px;
  height:200px;
  margin:0 auto 40px;
