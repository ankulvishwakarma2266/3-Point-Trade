<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f8f5;
  color:#173d35;
}

.page{
  width:100%;
  max-width:680px;
  margin:auto;
  padding:35px 20px 45px;
}

.top-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.channel-name{
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}

.green-dot{
  width:13px;
  height:13px;
  background:#08a875;
  border-radius:50%;
  display:inline-block;
}

.live{
  background:#f5faf7;
  border:1px solid #dfeae5;
  border-radius:30px;
  padding:9px 17px;
  color:#00a36c;
  font-weight:700;
}

.live span{
  color:#ffb78c;
  margin-right:6px;
}

.card{
  background:white;
  border-radius:40px;
  padding:40px 32px 35px;
  box-shadow:0 10px 35px rgba(0,80,50,.10);
}

.profile{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:28px;
}

.profile-img{
  width:108px;
  height:108px;
  border-radius:28px;
  object-fit:cover;
  border:4px solid #fff;
  box-shadow:0 8px 20px rgba(0,100,70,.18);
}

.profile-info h1{
  margin:0 0 8px;
  font-size:25px;
  line-height:1.15;
  color:#123d35;
}

.profile-info p{
  margin:0;
  font-size:18px;
  color:#91aaa3;
}

.description{
  font-size:22px;
  line-height:1.65;
  color:#536d67;
  margin:0 0 28px;
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:32px;
}

.feature{
  background:#f0f7f3;
  border:1px solid #dce9e3;
  border-radius:20px;
  padding:17px 8px;
  text-align:center;
}

.feature strong{
  display:block;
  font-size:21px;
  color:#008d65;
  margin-bottom:7px;
}

.feature span{
  font-size:15px;
  color:#819b94;
  font-weight:600;
}

.join-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  min-height:90px;
  background:#00a873;
  color:#fff !important;
  text-decoration:none !important;
  border-radius:28px;
  font-size:24px;
  font-weight:700;
  box-shadow:0 12px 25px rgba(0,168,115,.25);
  transition:.2s;
}

.join-btn:hover{
  background:#008e61;
  transform:translateY(-2px);
}

.telegram-icon{
  font-size:27px;
}

.arrow{
  font-size:28px;
}

.direct{
  text-align:center;
  margin:18px 0 35px;
  color:#91a8a2;
  font-size:16px;
}

.direct:before{
  content:"🔒 ";
}

.bottom-features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:35px;
}

.bottom-box{
  background:#f1f7f4;
  border:1px solid #dce9e3;
  border-radius:22px;
  min-height:105px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:12px;
}

.check{
  color:#008f68;
  font-size:30px;
  line-height:1;
}

.bottom-box span{
  color:#506a64;
  font-size:16px;
  font-weight:600;
}

.about{
  text-align:center;
  color:#899f99;
  font-size:18px;
  line-height:1.65;
  margin-bottom:28px;
}

.powered{
  background:#f0f6f3;
  border:1px solid #dce8e3;
  border-radius:20px;
  padding:17px 10px;
  text-align:center;
  color:#59736c;
  font-size:17px;
  font-weight:600;
}

.powered b{
  color:#f07822;
  margin-left:5px;
}

.copyright{
  text-align:center;
  color:#9aaca7;
  font-size:15px;
  margin:25px 0;
}

.disclaimer{
  background:#f0f6f3;
  border:1px solid #dce8e3;
  border-radius:22px;
  padding:18px 15px;
  text-align:center;
  color:#8a9e99;
  font-size:15px;
  line-height:1
